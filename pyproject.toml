[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitpilot"
version = "0.1.0"
description = "Deterministic behavioral circuit synthesis and LTspice verification tools"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.scripts]
circuitpilot = "circuitpilot.__main__:main"
circuitpilot-design = "circuitpilot.design_request_cli:main"
circuitpilot-examples = "circuitpilot.examples_cli:main"
circuitpilot-schematics = "circuitpilot.schematics_cli:main"

[tool.setuptools.packages.find]
where = ["engine"]
include = ["circuitpilot"]
namespaces = false
